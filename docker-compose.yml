services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: party-app:latest
    container_name: einladung
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=http://localhost:3000
      - DATABASE_PATH=/data/app.db
      - BLOB_STORAGE_PATH=/data/blobs
      - MASTER_KEY_DIR=/config/keys
      - EVENTS_KEY_DIR=/config/keys/events
      # Optional master key passphrase - if omitted, auto-generated on first boot
      # - MASTER_KEY_PASSPHRASE=your-secure-passphrase
    volumes:
      # Persistent SQLite DB and encrypted media blobs
      - party_data:/data
      # Cryptographic master keys and event keys (back up separately!)
      - party_config:/config
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (r) => { process.exit(r.statusCode < 400 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  party_data:
  party_config:
